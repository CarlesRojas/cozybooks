<svg xmlns="http://www.w3.org/2000/svg" viewBox="102 102 308 308" width="308" height="308" fill="none">
    <defs>
        <!-- Spans the mark, not each bar: in the default objectBoundingBox units every
             rect would restart the gradient and the three would come out identical.
             Bottom left to top right across the whole stack, the 45 degrees the rest
             of the app uses. -->
        <linearGradient id="cozybooks" gradientUnits="userSpaceOnUse" x1="112" y1="372" x2="400" y2="140">
            <stop offset="0" stop-color="#9e4ce0"/>
            <stop offset="1" stop-color="#db7048"/>
        </linearGradient>
    </defs>

    <!-- The viewBox is cropped to the bars, so the mark meets the edges. The app icons
         beside this add their own padding: Apple composites the icon on its own tile
         and a maskable icon has a safe zone to stay inside. -->
    <g fill="url(#cozybooks)">
        <rect x="112" y="140" width="232" height="64" rx="20"/>
        <rect x="136" y="224" width="264" height="64" rx="20"/>
        <rect x="112" y="308" width="288" height="64" rx="20"/>
    </g>
</svg>
