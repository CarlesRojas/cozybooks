<svg xmlns="http://www.w3.org/2000/svg" viewBox="102 102 308 308" width="308" height="308" fill="none">
    <defs>
        <linearGradient id="cozybooks" gradientUnits="userSpaceOnUse" x1="112" y1="372" x2="400" y2="140">
            <stop offset="0" stop-color="#9e4ce0"/>
            <stop offset="1" stop-color="#db7048"/>
        </linearGradient>
    </defs>

    <!-- `logo.svg` on a black tile, for placing the mark on a surface it would
         otherwise disappear into. Same crop, so the bars meet the tile's edges — which
         caps the corner radius: the arc spans the first 36 units and the top bar
         starts at 140, so anything rounder starts cutting into it. -->
    <rect x="102" y="102" width="308" height="308" rx="36" fill="#000"/>

    <g fill="url(#cozybooks)">
        <rect x="112" y="140" width="232" height="64" rx="20"/>
        <rect x="136" y="224" width="264" height="64" rx="20"/>
        <rect x="112" y="308" width="288" height="64" rx="20"/>
    </g>
</svg>
